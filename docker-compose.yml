services:
  hunter:
    build: .
    image: auction-hunter:latest
    container_name: auction-hunter
    restart: unless-stopped

    # Webhook og andre hemmeligheder læses fra .env, som ikke kommer i git.
    env_file:
      - .env

    environment:
      # Intervallet kan kun sættes op, aldrig under 900s (auktionsvilkår).
      SCRAPE_INTERVAL_SECONDS: "900"
      LOG_LEVEL: "INFO"
      # AI-trinnet og dets nøgle sættes i .env (læses via env_file ovenfor), så
      # her duplikeres de ikke — en værdi her ville overskygge interests.yml.

    volumes:
      # Hukommelsen (SQLite) og interesseprofilen lever uden for containeren,
      # så de overlever genopbygning og kan redigeres direkte.
      - ./data:/app/data
      - ./config:/app/config
      - ./reports:/app/reports

    # Ingen ports: agenten henter kun data ud og skal ikke nås udefra.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: auction-hunter:latest
    container_name: auction-hunter-web
    restart: unless-stopped
    command: ["python", "-m", "auction_hunter", "web"]
    depends_on:
      - hunter

    # WEB_PASSWORD og WEB_SECRET_KEY sættes i .env. Uden adgangskode kører
    # dashboardet åbent — og det kan redigere interesseprofilen.
    env_file:
      - .env

    environment:
      LOG_LEVEL: "INFO"

    volumes:
      # Skriveadgang til data: dashboardet gemmer markeringer.
      - ./data:/app/data
      # Skriveadgang til config: interesseprofilen kan redigeres fra siden.
      # Sæt ':ro' her hvis du hellere vil redigere filen i en editor.
      - ./config:/app/config

    ports:
      - "8080:8080"

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

    healthcheck:
      # Rammer kun databasen, ikke auktionshuset.
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
