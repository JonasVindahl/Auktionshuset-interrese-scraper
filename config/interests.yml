# Auktionshuset Hunter — interesseprofil
#
# Alt i denne fil kan overrides med miljøvariabler (se README).
# Filen læses på ny ved hver kørsel, så ændringer slår igennem uden genstart.

source:
  base_url: https://auktionshuset.dk
  # 'all' følger alle landsdele fra regions-mappingen nedenfor, så agenten ikke
  # kun ser Sjælland. Skriv enkelte id'er for at indsnævre.
  region_ids: all
  # region_label udledes automatisk ("Hele Danmark" for alle). Sæt den kun hvis
  # du vil have dit eget navn i beskederne.
  # region_label: Sjælland
  # 1 = aktive auktioner, 0 = afsluttede, 2 = alle
  auction_status: 1

regions:
  Nordjylland: w3OmpOjkLx
  Midtjylland: RVz0ALE6Wr
  Sønderjylland: M15jaL0J2l
  Fyn: epV0wO0K7l
  Sjælland: lyr0boj4d8

# Prisloftet er blødt: fund over grænsen rapporteres stadig, men markeres
# "over budget", indtil de passerer max_price * soft_over_budget_factor.
budget:
  max_price: 1000
  soft_over_budget_factor: 2.5

# Prisen for at afgive første bud på et lot uden bud.
opening_bid: 50

# AI-trin: et sprogmodel-kald der kun kører på lots der allerede har matchet på
# nøgleord. Det fanger den slags støj nøgleord ikke kan se — fx
# 'Div. lydudstyr: DVI-forlængere, HDD-adaptere mv.', hvor ordet 'hdd' står i
# titlen, men varen er et rodlot med adaptere.
#
# Krav: CLASSIFIER_API_KEY skal være sat (miljø, _FILE eller _FROM_ENV).
# Slå til/fra med 'enabled' her eller CLASSIFIER_ENABLED=1.
# Sæt CLASSIFIER_MODEL, CLASSIFIER_BASE_URL og CLASSIFIER_MAX_PER_RUN for at
# override uden at redigere filen. Funktionen virker med enhver
# OpenAI-kompatibel endpoint (OpenAI, Azure, OpenRouter, Ollama, vLLM).
classifier:
  enabled: false
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  # Loft pr. kørsel, så en fejlkonfiguration ikke kan løbe med budgettet.
  # Fund ud over loftet udskydes til næste kørsel i stedet for at sendes
  # uklassificeret.
  max_per_run: 25
  timeout: 30
  # Profilen læses af modellen for hvert lot. Skriv frit — den er den
  # egentlige 'smag', mens nøglelisterne kun er grovsortering.
  profile: |
    Jeg samler på og bruger:
    - IT og hacking-hardware: SDR, Proxmark, Flipper Zero, Raspberry Pi,
      netværksudstyr, switches, routere, firewalls
    - Servere og storage: rack- og towerservere, NAS, harddiske, SSD'er,
      RAID-controllere. Gerne hele maskiner, drevbunker og reservedele til dem.
    - Lyd og HiFi: forstærkere, højttalere, pladespillere, DAC'er, vintage
      anlæg. Gerne noget der kan repareres eller opgraderes.
    - Ure: mekaniske og automatiske, gerne vintage. Mærker med historie.
    - Elektronik og maker: oscilloskoper, måleudstyr, loddeudstyr, 3D-printere,
      komponenter og moduler.
    - Kaffe: espressomaskiner og kværne, gerne professionelt brugt.

    Jeg er IKKE interesseret i:
    - Tilbehør og forbrugsgoder: kabler, adaptere, batterier, opladere, tasker,
      flightcases, stativer, emballage, manualer, skærme og dockingstationer.
    - Rodlodder og blandede partier. Hvis titlen er en opremsning af forskellige
      småting ('diverse', 'mv.', 'm.m.', 'og andet'), er den næsten altid
      uinteressant, også selvom et enkelt nøgleord optræder.
    - Høretelefoner, headsets, tastaturer og mus.
    - Bulk-partier af forbrugsvarer uden enkeltværdi.

    Afvejning: et enkelt, komplet og fungerende stykke udstyr er langt mere
    interessant end en bunke dele. Er du i tvivl om et lot er et reelt stykke
    udstyr eller et rodlot, svar 'måske' frem for 'ja'.

# Lot-siderne: stand, skader og praktiske bemærkninger.
#
# Lot-listen indeholder kun en titel, og en titel kan ikke sige om varen er i
# stykker. Slået til henter agenten lot-siden for hvert fund og leder efter
# danske vendinger som "defekt", "reserverede" og "afhentning".
#
# Slået FRA som standard: det er et ekstra kald til auktionshuset for hvert
# fund, og deres vilkår tillader kun ét katalog-scrape hvert 15. minut. Har du
# læst vilkårene og vil have det, så hold loftet lavt.
details:
  enabled: false
  # Højst så mange lot-sider pr. kørsel.
  max_per_run: 10
  # Pause mellem kaldene.
  pause_seconds: 2.0

# Nøgleord der ALTID gør et lot uinteressant, uanset hvilken kategori det
# ellers ville matche. Brugeren er eksplicit ligeglad med høretelefoner,
# keyboards og mus — derfor udelukkes de her i stedet for at skulle undgås
# ved at fjerne hele mærker som Sennheiser fra HiFi-kategorien.
exclude:
  - høretelefoner
  - høretelefon
  - højtalertelefon
  - headset
  - in-ear
  - inear
  - earbuds
  - øretelefoner
  - øreprop
  - hovedtelefon
  - hovedtelefoner
  - tastatur
  - keyboard
  - keyboards
  - tastaturer
  - mus
  - computermus
  - musemåtte
  - trackpad
  - printerpatron
  - blækpatron
  - tonerkassette
  - tonepatron
  # Tilbehør og forbrugsgoder: interessante for nogen, men ikke for denne
  # profil. De støjer mere end de gavner, fordi de optræder i bunker.
  - flightcase
  - flight case
  - mikrofonstativ
  - kameratilbehør
  - batterier
  - batteri
  - bordoplader
  - opladere
  # Transportkasser er tilbehør. Uden denne fanges 'Rackkuffert med Switch'
  # på selve switch-nøgleordet, selvom varen er en kasse.
  - rackkuffert
  - rack kuffert
  - rackcase
  - rack case
  - transportkuffert
  # Reservedels- og rodpartier indeholder sjældent en komplet vare, men
  # indeholder ofte et mærkenavn der ellers ville udløse et match.
  - reservedele
  - reservedel
  - reserverdele
  - reserverdel

