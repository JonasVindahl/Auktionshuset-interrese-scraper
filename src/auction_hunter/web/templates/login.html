{% from "_icons.html" import icon %}
<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Log ind · Auktionshuset Hunter</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<main class="login-wrap">
  <a class="brand brand-login" href="/">
    {{ icon('mark', 20, 'brand-mark') }}
    <span class="brand-name">Auktionshuset <em>Hunter</em></span>
  </a>
  <h1>Log ind</h1>
  <p class="login-note">Dashboardet kan redigere interesseprofilen, så det kræver adgangskode.</p>

  {% if error %}<p class="banner is-err" role="alert">{{ icon('alert', 15) }}<span>{{ error }}</span></p>{% endif %}

  <form method="post" action="/login" class="login-form">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="sr-only" for="password">Adgangskode</label>
    <input id="password" type="password" name="password" placeholder="Adgangskode" autofocus required
           autocomplete="current-password">
    <button class="btn is-primary" type="submit">Log ind</button>
  </form>
</main>
</body>
</html>
