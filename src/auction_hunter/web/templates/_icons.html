{#- Monoline-ikoner som inline SVG. Ingen emoji, ingen ikonfont, ingen netværk.

    Alle ikoner deler samme viewBox og tegnes med currentColor, så de arver
    tekstfarven og følger temaet. Dekorative, derfor aria-hidden. -#}
{% macro icon(name, size=16, cls='') -%}
<svg class="ic{% if cls %} {{ cls }}{% endif %}" width="{{ size }}" height="{{ size }}"
     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'mark' -%}
  <path d="M3 11.4V5.6A2.6 2.6 0 0 1 5.6 3h5.8L21 12.6 12.6 21 3 11.4Z"/><circle cx="8" cy="8" r="1.35"/>
{%- elif name == 'search' -%}
  <circle cx="10.5" cy="10.5" r="6.2"/><path d="m14.9 14.9 5.1 5.1"/>
{%- elif name == 'filter' -%}
  <path d="M4 7h16M7 12h10M10 17h4"/>
{%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3.2 2"/>
{%- elif name == 'close' -%}
  <path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == 'check' -%}
  <path d="m5 12.8 4.4 4.4L19 6.6"/>
{%- elif name == 'bookmark' -%}
  <path d="M7 3.8h10a1 1 0 0 1 1 1v15.4l-6-3.6-6 3.6V4.8a1 1 0 0 1 1-1Z"/>
{%- elif name == 'ban' -%}
  <circle cx="12" cy="12" r="8.4"/><path d="m6.1 6.1 11.8 11.8"/>
{%- elif name == 'image' -%}
  <rect x="3.2" y="4.8" width="17.6" height="14.4" rx="2.2"/><circle cx="9" cy="10" r="1.6"/><path d="m4.4 17.4 4.7-4.4 3.4 3.1 2.6-2.3 4.5 4"/>
{%- elif name == 'download' -%}
  <path d="M12 3.6v10.2M7.6 9.6 12 14l4.4-4.4M4.4 17.4v2a1 1 0 0 0 1 1h13.2a1 1 0 0 0 1-1v-2"/>
{%- elif name == 'external' -%}
  <path d="M14 4.6h5.4V10M19.4 4.6 11 13M17.2 14v4.4a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 18.4V8.4A1.6 1.6 0 0 1 5.6 6.8H10"/>
{%- elif name == 'info' -%}
  <circle cx="12" cy="12" r="8.4"/><path d="M12 11v5.2M12 7.9v.1"/>
{%- elif name == 'alert' -%}
  <path d="M12 4.2 21 19.4H3L12 4.2Z"/><path d="M12 9.6v4.2M12 16.7v.1"/>
{%- elif name == 'grid' -%}
  <rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/>
  <rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/>
{%- elif name == 'list' -%}
  <path d="M4 6.5h16M4 12h16M4 17.5h16"/>
{%- elif name == 'keyboard' -%}
  <rect x="2.5" y="6" width="19" height="12" rx="2.2"/>
  <path d="M6 9.5h.01M9.5 9.5h.01M13 9.5h.01M16.5 9.5h.01M6 12.5h.01M9.5 12.5h.01M13 12.5h.01M16.5 12.5h.01M8 15.5h8"/>
{%- elif name == 'eye' -%}
  <path d="M2.6 12S6 5.8 12 5.8 21.4 12 21.4 12 18 18.2 12 18.2 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="2.6"/>
{%- elif name == 'chevron' -%}
  <path d="m8 5.6 6.4 6.4L8 18.4"/>
{%- elif name == 'plus' -%}
  <path d="M12 5.4v13.2M5.4 12h13.2"/>
{%- elif name == 'arrow-left' -%}
  <path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == 'arrow-right' -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'spark' -%}
  <path d="M12 3.6v3M12 17.4v3M3.6 12h3M17.4 12h3M6.1 6.1l2.1 2.1M15.8 15.8l2.1 2.1M17.9 6.1l-2.1 2.1M8.2 15.8l-2.1 2.1"/>
{%- elif name == 'logout' -%}
  <path d="M15 8.4V6.2a1.6 1.6 0 0 0-1.6-1.6H6.2A1.6 1.6 0 0 0 4.6 6.2v11.6a1.6 1.6 0 0 0 1.6 1.6h7.2a1.6 1.6 0 0 0 1.6-1.6v-2.2M9.6 12h10.8M17.4 8.6 20.8 12l-3.4 3.4"/>
{%- endif -%}
</svg>
{%- endmacro %}
